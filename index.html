<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ded8c8" />
    <meta name="description" content="端末内だけで音を解析する高精度クロマチックチューナー" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <script>
      (function(d) {
        var config = { kitId: 'aja3wts', scriptTimeout: 3000, async: true },
          h = d.documentElement,
          t = setTimeout(function() { h.className = h.className.replace(/\bwf-loading\b/g, '') + ' wf-inactive'; }, config.scriptTimeout),
          tk = d.createElement('script'),
          f = false,
          s = d.getElementsByTagName('script')[0],
          a;
        h.className += ' wf-loading';
        tk.src = 'https://use.typekit.net/' + config.kitId + '.js';
        tk.async = true;
        tk.onload = tk.onreadystatechange = function() {
          a = this.readyState;
          if (f || a && a !== 'complete' && a !== 'loaded') return;
          f = true;
          clearTimeout(t);
          try { Typekit.load(config); } catch (error) { /* system font fallback */ }
        };
        s.parentNode.insertBefore(tk, s);
      })(document);
    </script>
    <title>Quiet Tuner System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
